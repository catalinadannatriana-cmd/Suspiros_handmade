<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Suspiros Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-admin">

    <!-- SECCIÓN 1: INICIO DE SESIÓN -->
    <main id="login-seccion" class="login-container">
        <div class="login-box">
            <h1>Suspiros Handmade</h1>
            <h2>Panel de Administración</h2>
            <p>Ingresa tus credenciales para gestionar el negocio</p>

            <form id="form-login">
                <div class="campo-form">
                    <label for="correo">Correo o Usuario:</label>
                    <input type="email" id="correo" name="usuario" placeholder="admin@suspiros.com" required>
                </div>

                <div class="campo-form">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="password" placeholder="********" required>
                </div>

                <!-- Mensaje si el correo o clave fallan -->
                <p id="login-error" style="color: red;"></p>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <div class="volver-home">
                <a href="index.html">&larr; Volver a la página principal</a>
            </div>
        </div>
    </main>

    <!-- SECCIÓN 2: PANEL DE MENSAJES (Aparece al iniciar sesión) -->
    <section id="panel-seccion" class="login-container" hidden>
        <div class="login-box">
            <h2>Mensajes Recibidos</h2>
            <button id="btn-salir" class="btn-login">Cerrar sesión</button>
            
            <!-- Aquí other.js pondrá los mensajes de Supabase -->
            <div id="lista-mensajes"></div>
        </div>
    </section>

    <script type="module" src="other.js"></script>
</body>
</html>
