<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Suspiros Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-admin">

    <main class="login-container">
        <div class="login-box">
            <h1>Suspiros Handmade</h1>
            <h2>Panel de Administración</h2>
            <p>Ingresa tus credenciales para gestionar el negocio</p>

            <!-- Formulario para el Inicio de Sesión -->
            <form action="#" method="post">
                <div class="campo-form">
                    <label for="usuario">Correo o Usuario:</label>
                    <input type="email" id="usuario" name="usuario" placeholder="admin@suspiros.com" required>
                </div>

                <div class="campo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <div class="volver-home">
                <a href="index.html">&larr; Volver a la página principal</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
