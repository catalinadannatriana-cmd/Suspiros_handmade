<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Suspiros Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-admin">

    <main class="login-container">
        <div class="login-box">
            <h1>Suspiros Handmade</h1>
            <h2>Panel de Administración</h2>

            <!-- SECCIÓN 1: El formulario de Login (Se ve al entrar) -->
            <section id="login-section">
                <p>Ingresa tus credenciales para gestionar el negocio</p>
                <form id="form-login">
                    <div class="campo-form">
                        <label for="usuario">Correo o Usuario:</label>
                        <input type="email" id="usuario" name="usuario" placeholder="admin@suspiros.com" required>
                    </div>

                    <div class="campo-form">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="********" required>
                    </div>

                    <button type="submit" class="btn-login">Ingresar</button>
                </form>
            </section>

            <!-- SECCIÓN 2: El panel de mensajes (Oculto hasta que ingresen bien) -->
            <section id="dashboard-section" style="display: none;">
                <p style="color: green; font-weight: bold;">¡Bienvenidas, Catalina y Juliana! 💜</p>
                <h3>Mensajes recibidos de clientes:</h3>
                
                <!-- Aquí JavaScript inyectará los mensajes de Supabase para la lista de registros -->
                <div id="lista-mensajes" style="max-height: 300px; overflow-y: auto; text-align: left; margin-top: 15px;">
                </div>

                <button id="btn-cerrar-sesion" class="btn-login" style="background-color: #a0522d; margin-top: 15px;">Cerrar Sesión</button>
            </section>

            <!-- Enlace para volver -->
            <div class="volver-home" style="margin-top: 20px;">
                <a href="index.html">&larr; Volver a la página principal</a>
            </div>
        </div>
    </main>

    <!-- Cargamos nuestro script como módulo para usar Supabase -->
    <script type="module" src="script.js"></script>
</body>
</html>
